name: Release

on:
  release:
    types: [published]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run --cache ./.npm-cache
      - name: Check published version
        id: package
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is not published yet."
          fi
      - if: steps.package.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.package.outputs.exists == 'false'
        name: Sync server.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e "
            const fs = require('node:fs');
            const path = 'server.json';
            const server = JSON.parse(fs.readFileSync(path, 'utf8'));
            server.version = process.argv[1];
            for (const pkg of server.packages ?? []) {
              pkg.version = process.argv[1];
            }
            fs.writeFileSync(path, JSON.stringify(server, null, 2) + '\n');
          " "$version"
      - if: steps.package.outputs.exists == 'false'
        name: Install mcp-publisher
        shell: bash
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
      - if: steps.package.outputs.exists == 'false'
        name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
