name: Staging

on:
  push:
    branches: [staging]

jobs:
  publish-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run --cache ./.npm-cache
      - name: Compute a unique staging prerelease version
        id: version
        shell: bash
        run: |
          base_version="$(node -p "require('./package.json').version")"
          staging_version="${base_version}-staging.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$staging_version" >> "$GITHUB_OUTPUT"
          echo "Staging version: $staging_version"
      - name: Set staging version (local to this run only, not committed)
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Publish to npm under the "staging" dist-tag
        run: npm publish --tag staging --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Summary
        run: |
          echo "### Staging publish succeeded :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install with: \`npm install mcp-db-connect@staging\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Or pin the exact build: \`npm install mcp-db-connect@${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This published under the \`staging\` npm dist-tag only — it never touches \`latest\`, so regular users (\`npm install mcp-db-connect\`) are unaffected." >> "$GITHUB_STEP_SUMMARY"
